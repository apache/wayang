version: 2
updates:
  # Security updates already run without this file. This turns on scheduled
  # version updates for every Maven module, one pull request per dependency.
  - package-ecosystem: maven
    directories:
      - "/"
      - "/*"
      - "/*/*"
      - "/*/*/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      maven:
        patterns:
          - "*"
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - "CI&CD"
    commit-message:
      prefix: build
      include: scope
