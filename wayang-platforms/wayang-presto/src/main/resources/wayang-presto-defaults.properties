# Connection (override per deployment in wayang.properties)
# wayang.presto.jdbc.url      = jdbc:presto://localhost:8080
# wayang.presto.jdbc.user     = test
# wayang.presto.jdbc.password = (optional; omit when no password is required)
wayang.presto.jdbc.driverName = com.facebook.presto.jdbc.PrestoDriver

# Hardware profile used by LoadProfileToTimeConverter.
# Presto runs as a distributed MPP cluster; model a representative coordinator node.
wayang.presto.cpu.mhz  = 2700
wayang.presto.cores    = 4
wayang.presto.costs.fix    = 0.0
wayang.presto.costs.per-ms = 1.0

# Cost model
#
# Formula: cpu = alpha * rows + beta
#
# The concrete .load entries below are reference parameters learned from the
# local Week 8 Presto profiling run. Scope: S01-S13, row counts
# 10k/50k/100k/250k, 1 warm-up plus 5 measured repetitions. They are useful
# starting values for trying Wayang, but users should rerun profiling on their
# own Presto deployment and machine for accurate optimization.
# Keep the matching .load.template entries so the parameters can be relearned.
wayang.presto.tablesource.load.template = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"?*out0 + ?",\
  "ram":"0",\
  "p":0.9\
}
wayang.presto.tablesource.load = {\
 "type":"mathex",\
 "in":0,\
 "out":1,\
 "cpu":"((3.8231612775422605)*(out0))+(3.486271520327456E8)",\
 "ram":"0",\
 "disk":"0",\
 "net":"0",\
 "p":0.9\
}

