# Connection (override per deployment in wayang.properties)
# wayang.clickhouse.jdbc.url      = jdbc:clickhouse://localhost:8123/default
# wayang.clickhouse.jdbc.user     = default
# wayang.clickhouse.jdbc.password =

# Table sink ENGINE used by CREATE TABLE ... AS SELECT (overwrite mode).
# May also be set on a TableSink Properties object under the same key.
wayang.clickhouse.tablesink.engine = MergeTree ORDER BY tuple()

# Cost function parameters
# NB: Not measured. Placeholder values so the optimizer can schedule ClickHouse
# operators; calibrate later with a ClickHouseCostPilotIT.
wayang.clickhouse.cpu.mhz = 2700
wayang.clickhouse.cores = 4
wayang.clickhouse.costs.fix = 0.0
wayang.clickhouse.costs.per-ms = 1.0

wayang.clickhouse.tablesource.load.template = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"?*out0 + ?",\
  "ram":"0",\
  "p":0.9\
}
# NB: Not measured.
wayang.clickhouse.tablesource.load = {\
  "in":0, "out":1,\
  "cpu":"${55*out0 + 380000}",\
  "ram":"0",\
  "p":0.9\
}

