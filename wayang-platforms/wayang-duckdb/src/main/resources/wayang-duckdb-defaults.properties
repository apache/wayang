# Connection (override per deployment in wayang.properties).
# Use jdbc:duckdb:<path> for a persistent database file.
wayang.duckdb.jdbc.url = jdbc:duckdb:
wayang.duckdb.jdbc.user =
wayang.duckdb.jdbc.password =
wayang.duckdb.jdbc.driverName = org.duckdb.DuckDBDriver

# ParquetSource support.
# Use mappings to keep ParquetSource inputUrl as a canonical Parquet URI while
# resolving it to a DuckDB-visible SQL relation during execution.
# Format: parquet-uri=duckdb-relation;parquet-uri-2=duckdb-relation-2
# wayang.duckdb.parquetsource.mappings = file:///data/orders.parquet=wayang_parquet.orders
#
# Optional auto-create support. When enabled, DuckDB creates a view over
# read_parquet('${uri}') before composing the SQL stage.
wayang.duckdb.parquetsource.auto-create = false
wayang.duckdb.parquetsource.auto-create.relation-prefix = wayang_parquet_
wayang.duckdb.parquetsource.auto-create.template = CREATE OR REPLACE VIEW ${relation} AS SELECT * FROM read_parquet('${uri}')
#
# Optional prepare SQL executed before DuckDB creates the Parquet view. Keep
# statements idempotent: they can run during optimization cardinality estimation
# and during execution. This can load DuckDB extensions such as httpfs.

# Hardware profile used by LoadProfileToTimeConverter.
wayang.duckdb.cpu.mhz = 2700
wayang.duckdb.cores = 4
wayang.duckdb.costs.fix = 0.0
wayang.duckdb.costs.per-ms = 1.0

# Reference cost model learned from the Trino Week8-style DuckDB pilot
# (S01-S13, 10k/50k/100k/250k rows, 6 repetitions).
# Re-profile for deployment-specific hardware, data shape, and PRAGMA threads.

wayang.duckdb.tablesource.load.template = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"?*out0 + ?",\
  "ram":"0",\
  "p":0.9\
}
wayang.duckdb.tablesource.load = {\
 "type":"mathex",\
 "in":0,\
 "out":1,\
 "cpu":"((10.472865061115924)*(out0))+(14042.766808200337)",\
 "ram":"0",\
 "disk":"0",\
 "net":"0",\
 "p":0.9\
}

