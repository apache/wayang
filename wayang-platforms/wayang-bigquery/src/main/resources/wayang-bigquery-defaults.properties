# JDBC driver (loaded via reflection; no compile-time dependency needed)
wayang.bigquery.jdbc.driverName = com.google.cloud.bigquery.jdbc.BigQueryDriver

# Optional Parquet source resolution.
# Use this to keep ParquetSource inputUrl as a canonical Parquet URI while
# resolving it to a BigQuery-visible external table during execution.
# Format: parquet-uri=bigquery-relation;parquet-uri-2=bigquery-relation-2
# wayang.bigquery.parquetsource.mappings = gs://bucket/orders/*.parquet=`project.dataset.orders`
#
# Optional auto-create support. Keep disabled unless the configured dataset is
# available and the URI is readable by BigQuery.
# wayang.bigquery.parquetsource.auto-create = false
# wayang.bigquery.parquetsource.auto-create.relation-prefix = project.dataset.wayang_parquet_
# wayang.bigquery.parquetsource.auto-create.template = CREATE EXTERNAL TABLE IF NOT EXISTS ${relation} OPTIONS (format = 'PARQUET', uris = ['${uri}'])

# Connection URL and credentials are deployment-specific.
# Set these in your wayang.properties or programmatically via Configuration.
#
# Example:
#   wayang.bigquery.jdbc.url = jdbc:bigquery://https://www.googleapis.com/bigquery/v2;\
#     ProjectId=my-project;\
#     OAuthType=0;\
#     OAuthServiceAcctEmail=sa@my-project.iam.gserviceaccount.com;\
#     OAuthPvtKeyPath=/path/to/key.json
#
# wayang.bigquery.jdbc.url      = (required; set per deployment)
# wayang.bigquery.jdbc.user     = (optional)
# wayang.bigquery.jdbc.password = (optional)

# Hardware profile
# BigQuery is serverless and runs on Google's shared compute.
# Model enough cores for full parallelism; latency is dominated by network
# and query dispatch rather than raw CPU.
wayang.bigquery.cpu.mhz   = 2700
wayang.bigquery.cores     = 8
wayang.bigquery.costs.fix     = 0.0
wayang.bigquery.costs.per-ms  = 1.0

# Cost model
#
# Formula: cpu = alpha * rows + beta
#
# The concrete .load entries below are reference parameters learned from the
# local Week 8 BigQuery profiling run. Scope: S01-S13, row counts
# 10k/50k/100k/250k, 1 warm-up plus 5 measured repetitions. They are useful
# starting values for trying Wayang, but users should rerun profiling on their
# own BigQuery project, network path, and machine for accurate optimization.
# Keep the matching .load.template entries so the parameters can be relearned.
wayang.bigquery.tablesource.load.template = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"?*out0 + ?",\
  "ram":"0",\
  "p":0.9\
}
wayang.bigquery.tablesource.load = {\
 "type":"mathex",\
 "in":0,\
 "out":1,\
 "cpu":"((14413.46986499083)*(out0))+(1.1058853943247876E9)",\
 "ram":"0",\
 "disk":"0",\
 "net":"0",\
 "p":0.9\
}

