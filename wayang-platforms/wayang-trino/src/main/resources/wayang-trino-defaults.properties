# Connection (override per deployment in wayang.properties)
# wayang.trino.jdbc.url      = jdbc:trino://localhost:8080
# wayang.trino.jdbc.user     = admin
# wayang.trino.jdbc.password =
wayang.trino.jdbc.driverName = io.trino.jdbc.TrinoDriver

# Optional Parquet source resolution.
# Use this to keep ParquetSource inputUrl as a canonical Parquet URI while
# resolving it to a Trino-visible SQL relation during execution.
# Format: parquet-uri=trino-relation;parquet-uri-2=trino-relation-2
# wayang.trino.parquetsource.mappings = file:///data/orders=iceberg.profile.orders
#
# Optional auto-create support. Keep disabled unless the configured catalog
# supports the selected DDL syntax.
# wayang.trino.parquetsource.auto-create = false
# wayang.trino.parquetsource.auto-create.relation-prefix = iceberg.profile.wayang_parquet_
# wayang.trino.parquetsource.auto-create.template = CREATE TABLE IF NOT EXISTS ${relation} (${columns}) WITH (format = 'PARQUET', external_location = '${uri}')

# Hardware profile used by LoadProfileToTimeConverter.
# Trino runs as a distributed cluster; model a representative coordinator node.
wayang.trino.cpu.mhz  = 2700
wayang.trino.cores    = 4
wayang.trino.costs.fix    = 0.0
wayang.trino.costs.per-ms = 1.0

# Cost model
#
# Formula: cpu = alpha * rows + beta
#
# The concrete .load entries below are reference parameters learned from the
# local Week 8-2 Trino profiling run. Scope: S01-S13, row counts
# 10k/50k/100k/250k, 1 warm-up plus 5 measured repetitions. They are useful
# starting values for trying Wayang, but users should rerun profiling on their
# own Trino deployment and machine for accurate optimization.
# Keep the matching .load.template entries so the parameters can be relearned.
wayang.trino.tablesource.load.template = {\
  "type":"mathex", "in":0, "out":1,\
  "cpu":"?*out0 + ?",\
  "ram":"0",\
  "p":0.9\
}
wayang.trino.tablesource.load = {\
 "type":"mathex",\
 "in":0,\
 "out":1,\
 "cpu":"((0.04991194623872751)*(out0))+(5.650937751899713E7)",\
 "ram":"0",\
 "disk":"0",\
 "net":"0",\
 "p":0.9\
}

